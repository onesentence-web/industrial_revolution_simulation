['철도와 시장','철도역','운송 상인','철도를 이용하면 상품을 먼 지역에 빨리 보낼 수 있습니다.','물건은 어떻게 이동할까?', [['철도를 이용한다',[-7,-3,6,3,18,4],'운송이 빨라져 판매 범위가 넓어졌습니다.','money<7'],['기존 운송을 이용한다',[4,0,0,3,4,2],'비용은 줄였지만 운송은 느렸습니다.'],['새 시장을 개척한다',[6,-9,2,1,13,3],'판매 지역을 넓혔습니다.']],'철도와 증기선은 운송과 시장 확대에 기여했습니다.',2],
['노동 조건을 바꿀까','방직 공장','노동자 대표','기계는 빨라졌지만 노동 시간이 길어요. 개선할 수 있을까요?','쉬는 문제는 누구와 연결될까?', [['노동 시간을 줄인다',[-8,2,9,6,-3,7],'당장 이윤은 줄었지만 노동 조건 개선을 시도했습니다.','money<8'],['생산 목표를 유지한다',[10,-2,-9,-4,15,-7],'이윤과 생산량은 늘었지만 갈등이 커졌습니다.'],['노동자와 절충한다',[2,-3,5,3,5,6],'갈등을 조정하려 했습니다.']],'공장 주인의 이윤과 노동자의 조건 사이에는 이해관계 차이가 생길 수 있었습니다.',3]
]]};
const keys=['money','health','mood','security','production','freedom'], labels=['돈','건강','기분','생활 안정','생산','선택의 자유'],colors=['#e9bf68','#e27d76','#e6bc67','#91c8a7','#7ac7e6','#b5a5e6'];
const startStats=(era)=>({money:era?26:25,health:78,mood:67,security:60,production:era?42:23,freedom:era?44:65});
let state={screen:'home',path:null,era:0,step:0,stats:null,records:[],eras:[],reflection:['',''],pending:null,finalChoice:'생산 방식',finalReason:'',answers:[]};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function resetGame(){if(confirm('처음부터 다시 시작할까요?')){state={screen:'home',path:null,era:0,step:0,stats:null,records:[],eras:[],reflection:['',''],pending:null,finalChoice:'생산 방식',finalReason:'',answers:[]};render()}}
function begin(id){state.path=paths.find(x=>x.id===id);state.era=0;state.step=0;state.stats=startStats(0);state.records=[];state.screen='play';render()}
function current(){return story[state.path.id][state.era][state.step]}
function isLocked(c){return c[3]&&state.stats.money<Number(c[3].split('<')[1])}
function portraitFor(era,stats){let base=state.path.id==='capital'?12:state.path.id==='textile'?7:6;let variant=stats.health<48||stats.mood<37?2:stats.health>70&&stats.mood>72?1:0;return ASSETS[base+variant]}
function bg(){return ASSETS[(state.era===0?[0,1,2,3]:[4,5,4,5])[state.step]]}
function statHtml(st){return keys.map((k,i)=>`<div><div class="stathead"><span>${labels[i]}</span><b>${st[k]}</b></div><div class="meter"><i style="width:${Math.min(100,st[k])}%;background:${colors[i]}"></i></div></div>`).join('')}
function choose(i){let e=current(),c=e[5][i];if(isLocked(c))return;let before={...state.stats};keys.forEach((k,j)=>state.stats[k]=Math.max(0,Math.min(100,state.stats[k]+c[1][j])));let r={theme:themes[state.step],event:e[0],choice:c[0],result:c[2],before,after:{...state.stats},note:e[6]};state.records.push(r);state.pending=r;state.screen='result';render()}
function next(){state.pending=null;state.step++;state.screen=state.step===4?'eraend':'play';render()}
function finishEra(){let val=document.getElementById('eraReflection').value.trim();if(val.length<12){alert('두 문장 정도로 작성해 주세요.');return}state.reflection[state.era]=val;state.eras.push({stats:{...state.stats},records:[...state.records]});if(state.era===0){state.era=1;state.step=0;state.stats=startStats(1);state.records=[];state.screen='transition'}else state.screen='compare';render()}
function finish(){let vals=['obs1','obs2','obs3','obs4'].map(id=>document.getElementById(id).value.trim());let reason=document.getElementById('reason').value.trim();if(vals.some(x=>x.length<3)||reason.length<20){alert('1~4단계의 답과 마지막 이유를 작성해 주세요.');return}state.answers=vals;state.finalChoice=document.querySelector('input[name=main]:checked')?.value||'생산 방식';state.finalReason=reason;state.screen='done';render()}
function report(){return `산업 혁명 타임슬립 V10\n직업 계열: ${state.path.name}\n\n`+state.eras.map((e,i)=>`${i?'1830':'1750'}년: ${i?state.path.b:state.path.a}\n`+keys.map((k,j)=>labels[j]+': '+e.stats[k]).join(' / ')+'\n'+e.records.map(r=>r.theme+' / '+r.choice+' → '+r.result).join('\n')+'\n나의 해석: '+state.reflection[i]).join('\n\n')+'\n\n단계별 비교:\n'+state.answers.map((a,i)=>(i+1)+'. '+a).join('\n')+'\n가장 중요한 변화: '+state.finalChoice+'\n이유: '+state.finalReason}
function download(){let u=URL.createObjectURL(new Blob([report()],{type:'text/plain;charset=utf-8'}));let a=document.createElement('a');a.href=u;a.download='산업혁명_타임슬립_탐구보고서.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
const SHEET_WEB_APP_URL='https://script.google.com/macros/s/AKfycbxiaYK361JcRDN8GZzMW8IdAnRXKHj-px5diLJ47yicxvqqv0KBZlipMDSp9pj-laOxwQ/exec';
let submitted=false;
async function submitToSheet(){
 const klass=document.getElementById('studentClass').value.trim();
 const num=document.getElementById('studentNumber').value.trim();
 const student=document.getElementById('studentName').value.trim();
 if(!klass||!num||!student){alert('학급, 번호, 이름을 모두 입력해 주세요.');return;}
 if(!/^\d{1,3}$/.test(num)){alert('번호는 숫자로 입력해 주세요.');return;}
 if(!SHEET_WEB_APP_URL.startsWith('https://script.google.com/macros/s/')){alert('교사가 Apps Script 웹앱 주소를 먼저 설정해야 합니다.');return;}
 const button=document.getElementById('sheetSubmit');
 button.disabled=true;button.textContent='제출 요청 중...';
 const payload={submissionId:crypto.randomUUID?crypto.randomUUID():String(Date.now())+'-'+Math.random().toString(36).slice(2),klass,num,student,role:state.path.name,role1750:state.path.a,role1830:state.path.b,reflection1750:state.reflection[0],reflection1830:state.reflection[1],obs1:state.answers[0],obs2:state.answers[1],obs3:state.answers[2],obs4:state.answers[3],finalChoice:state.finalChoice,finalReason:state.finalReason,stats1750:state.eras[0].stats,stats1830:state.eras[1].stats,records1750:state.eras[0].records,records1830:state.eras[1].records,fullReport:report()};
 try{
  await fetch(SHEET_WEB_APP_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
  submitted=true;
  document.getElementById('sheetMessage').textContent='제출 요청을 보냈습니다. 브라우저 보안상 저장 성공 여부는 확인할 수 없으니 선생님께 시트 확인을 요청하세요.';
  button.textContent='다시 제출 요청';
 }catch(err){document.getElementById('sheetMessage').textContent='전송 요청에 실패했습니다. 인터넷 연결과 웹앱 주소를 확인하세요.';button.textContent='다시 제출';}
 finally{button.disabled=false;}
}
function render(){let h='';if(state.screen==='home'){h=`<section class="hero" style="background-image:url('${ASSETS[4]}')"><div><span class="tag">4가지 같은 주제 · 2번의 삶</span><h1>똑같은 하루, 80년 후 달라진 삶</h1><p>아침에 일하고, 돈을 벌고, 식사를 마련하고, 쉬고 싶을 때… 1750년과 1830년의 삶은 어떻게 달랐을까요?</p><button class="btn primary" onclick="state.screen='roles';render()">게임 시작 →</button></div></section>`}
else if(state.screen==='roles'){h=`<section class="panel"><span class="tag">직업 계열 선택</span><h2>비슷한 생계활동을 하는 두 시대의 인물을 비교하세요</h2><div class="roles">${paths.map(p=>`<button class="role" onclick="begin('${p.id}')"><img src="${ASSETS[p.pic]}" alt="인물"><b>${p.name}</b><div>${p.a} → ${p.b}</div><p class="muted">${p.desc}</p></button>`).join('')}</div></section>`}
else if(state.screen==='transition'){h=`<section class="hero" style="background-image:url('${ASSETS[4]}')"><div><span class="tag">1750년 → 1830년</span><h1>80년 뒤, 같은 고민을 다시!</h1><p>이번에도 아침의 일, 돈 벌기, 식사, 휴식의 4가지 상황을 경험합니다. <b>${state.path.b}</b>의 삶은 무엇이 다를까요?</p><button class="btn primary" onclick="state.screen='play';render()">1830년 체험하기 →</button></div></section>`}
else if(state.screen==='play'||state.screen==='result'){let e=current(),r=state.pending;h=`<div class="game"><aside><section class="panel"><span class="tag">${state.era?'1830':'1750'}년 · ${state.step+1}/4</span><h2>${state.era?state.path.b:state.path.a}</h2><div class="muted">${themes[state.step]}</div><div class="stats">${statHtml(state.stats)}</div></section><section class="panel"><b>📓 선택 기록</b><ol class="log">${state.records.map(x=>`<li>${esc(x.theme)}: ${esc(x.choice)}</li>`).join('')||'<li>아직 선택하지 않았습니다.</li>'}</ol></section></aside><div><div class="progress">${themes.map((_,i)=>`<i class="${i<=state.step?'on':''}"></i>`).join('')}</div><div class="visual" style="background-image:url('${bg()}')"><span class="loc">${state.era?'1830':'1750'}년 · ${esc(e[1])}</span><img class="portrait" src="${portraitFor(state.era,state.stats)}" alt="현재 상태를 반영한 인물 표정"></div><div class="story">${state.screen==='play'?`<span class="tag">${esc(themes[state.step])}</span><h2>${esc(e[0])}</h2><p><span class="npc">${esc(e[2])}</span> “${esc(e[3])}”</p><div class="note">🔍 생각해 보기: <b>${esc(e[4])}</b></div><div class="choices">${e[5].map((c,i)=>`<button class="choice" ${isLocked(c)?'disabled':''} onclick="choose(${i})"><b>${esc(c[0])}</b><small>${isLocked(c)?'🔒 돈이 부족해 선택할 수 없습니다.':'선택하면 어떤 결과가 생길까요?'}</small></button>`).join('')}</div>`:`<span class="tag">선택의 결과</span><h2>${esc(r.choice)}</h2><p>${esc(r.result)}</p><div class="delta">${keys.map((k,i)=>{let d=r.after[k]-r.before[k];return `<span>${labels[i]} ${d>0?'+':''}${d}</span>`}).join('')}</div><div class="note">📚 역사와 연결: ${esc(e[6])}</div><div class="note">🧭 지금 내 모습은 왜 달라졌을까요? 돈과 건강, 생활 안정의 변화를 살펴보세요.</div><button class="btn primary" onclick="next()">${state.step===3?'이 시대의 하루 마무리':'다음 상황으로'} →</button>`}</div></div></div>`}
else if(state.screen==='eraend'){let st=state.stats;h=`<section class="panel"><span class="tag">${state.era?'1830':'1750'}년 체험 완료</span><h2>${state.era?state.path.b:state.path.a}의 하루</h2><div class="comparison"><div><img src="${ASSETS[state.era?4:0]}"><h3>내가 겪은 사건</h3><ol>${state.records.map(r=>`<li>${esc(r.theme)}: ${esc(r.choice)}</li>`).join('')}</ol></div><div><img src="${portraitFor(state.era,st)}"><h3>최종 누적 상태</h3><div class="stats">${statHtml(st)}</div></div></div><div class="step"><strong>① 가장 기억에 남는 사건은?</strong><p>${state.records.map((r,i)=>`${i+1}. ${esc(r.event)} `).join(' / ')}</p><strong>② 나는 무엇을 선택했고, 무엇이 달라졌나요?</strong><strong>③ 이 시대의 삶은 어떤 점에서 쉽거나 어려웠나요?</strong><textarea id="eraReflection" placeholder="예: 나는 ○○ 사건에서 ○○을 선택했다. 그 결과 건강이 줄었다. 당시에는 ○○ 때문에 이런 선택을 해야 했다."></textarea></div><button class="btn primary" onclick="finishEra()">${state.era?'두 시대 나란히 비교하기':'80년 후로 이동하기'} →</button></section>`}
else if(state.screen==='compare'||state.screen==='done'){let a=state.eras[0],b=state.eras[1];h=`<section class="panel"><span class="tag">두 시대 비교</span><h1>똑같은 고민, 달라진 세상</h1><p class="muted">같은 주제의 사건을 나란히 보세요. 시대에 따라 무엇이 달라졌나요?</p>${themes.map((t,i)=>`<div class="panel"><h3>${i+1}. ${t}</h3><div class="comparison"><div><img src="${ASSETS[[0,1,2,3][i]]}"><b>1750년 · ${state.path.a}</b><p>${esc(a.records[i].event)}</p><p>내 선택: ${esc(a.records[i].choice)}</p><p class="muted">${esc(a.records[i].result)}</p></div><div><img src="${ASSETS[[4,5,4,5][i]]}"><b>1830년 · ${state.path.b}</b><p>${esc(b.records[i].event)}</p><p>내 선택: ${esc(b.records[i].choice)}</p><p class="muted">${esc(b.records[i].result)}</p></div></div></div>`).join('')}<h2>누적 상태 비교</h2><div class="comparison"><div><b>1750년</b><div class="stats">${statHtml(a.stats)}</div></div><div><b>1830년</b><div class="stats">${statHtml(b.stats)}</div></div></div></section>`;
if(state.screen==='compare'){h+=`<section class="panel"><h2>📝 역사 탐구: 쉬운 질문부터 차근차근</h2><p class="muted">위의 두 시대 장면을 보면서 순서대로 답해 보세요.</p><div class="step"><strong>1단계 · 어디에서, 무엇으로 일했나요?</strong><div>1750년과 1830년의 일하는 장소나 도구를 비교해 보세요.</div><input id="obs1" placeholder="1750년에는 …, 1830년에는 …"></div><div class="step"><strong>2단계 · 돈은 어떻게 벌었나요?</strong><div>두 시대에 돈을 버는 방법이나 일거리를 결정하는 조건은 무엇이 달랐나요?</div><input id="obs2" placeholder="1750년에는 …, 1830년에는 …"></div><div class="step"><strong>3단계 · 쉬고 싶을 때는 어땠나요?</strong><div>두 시대에서 쉬기 어려웠던 이유를 각각 적어 보세요.</div><input id="obs3" placeholder="두 시대 모두 …, 하지만 1830년에는 …"></div><div class="step"><strong>4단계 · 가장 크게 달라진 점은?</strong><div>앞의 답에서 하나를 골라 적어 보세요.</div><input id="obs4" placeholder="가장 크게 달라진 점은 …"></div><div class="step"><strong>마지막 생각 질문 · 산업 혁명은 왜 '혁명'일까?</strong><div>가장 중요한 변화 하나를 고르세요.</div>${['생산 방식','일하는 방식','경제 구조','도시 생활'].map((v,i)=>`<label style="display:block;margin:9px 0"><input type="radio" name="main" value="${v}" ${i===0?'checked':''} style="width:auto"> ${v}</label>`).join('')}<div>그렇게 생각한 이유를 게임에서 겪은 사건과 연결해 적어 보세요.</div><textarea id="reason" placeholder="나는 ○○이 가장 크게 달라졌다고 생각한다. 왜냐하면 1750년에는 …, 1830년에는 …이었기 때문이다."></textarea></div><button class="btn primary" onclick="finish()">역사 탐구 완료 →</button></section>`}else{h+=`<section class="panel"><h2>🎉 역사 탐구 완료!</h2><p>가장 중요한 변화: <b>${esc(state.finalChoice)}</b></p><p>${esc(state.finalReason)}</p><div class="step"><strong>📤 선생님께 탐구 답변 제출하기</strong><p>학급·번호·이름을 입력하고 제출하세요.</p><div style="display:grid;grid-template-columns:1fr 1fr 2fr;gap:8px"><input id="studentClass" placeholder="학급 (예: 2)" autocomplete="off"><input id="studentNumber" placeholder="번호 (예: 15)" inputmode="numeric"><input id="studentName" placeholder="이름" autocomplete="name"></div><button id="sheetSubmit" class="btn primary" style="margin-top:12px" onclick="submitToSheet()">📤 스프레드시트에 제출</button><p id="sheetMessage" style="color:#544d38"></p></div><button class="btn primary" onclick="download()">📥 나의 선택과 답변 저장</button> <button class="btn" onclick="navigator.clipboard?.writeText(report()).then(()=>alert('복사했습니다.')).catch(()=>alert('복사할 수 없습니다. 보고서를 다운로드해 주세요.'))">답변 복사</button></section>`}}
document.getElementById('app').innerHTML=h}
render();
</script></body></html>
